[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idem-check"
version = "0.1.0"
description = "Deterministic drift detection for LLM APIs — catch a vendor silently swapping the model behind a stable API name."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Sumit Sharma" },
]
keywords = [
    "llm",
    "ai-governance",
    "model-drift",
    "llm-testing",
    "ai-audit",
    "openai",
    "anthropic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
all = ["openai>=1.0", "anthropic>=0.30"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "openai>=1.0", "anthropic>=0.30"]

[project.urls]
Homepage = "https://github.com/acekapila/idem"
Repository = "https://github.com/acekapila/idem"
Issues = "https://github.com/acekapila/idem/issues"

[project.scripts]
idem = "idem.cli:main"

[tool.setuptools]
packages = ["idem", "idem.templates"]

[tool.setuptools.package-data]
idem = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
